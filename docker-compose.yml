version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nool-and-nila:latest
    container_name: nool-and-nila-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/data/production.db
      - JWT_SECRET=${JWT_SECRET:-nool_and_nila_secure_production_jwt_secret_64chars_minimum_2026_xyz}
      - COOKIE_SECRET=${COOKIE_SECRET:-nool_and_nila_secure_cookie_secret_64chars_minimum_2026_abc}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - API_URL=${API_URL:-http://localhost:5000}
      - WHATSAPP_BUSINESS_NUMBER=${WHATSAPP_BUSINESS_NUMBER:-919876543210}
      - BACKUP_DIR=/data/backups
      - OFF_HOST_BACKUP_DIR=/data/dr-backups
    volumes:
      - nool-nila-data:/data

volumes:
  nool-nila-data:
    driver: local
